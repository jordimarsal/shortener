[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["shortener_app"]

[[tool.mypy.overrides]]
module = "validators.*"
ignore_missing_imports = true
