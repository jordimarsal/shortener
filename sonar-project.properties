# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
# CLI -D flags override these, so this file is the single place to tune the scan.
#
# Run `pytest tests/` first: it leaves coverage.xml at the repo root
# ([tool.pytest.ini_options] addopts).
sonar.projectKey=jordimarsal:shortener
sonar.sourceEncoding=UTF-8

# Explicitly include everything: the scanner CLI leaves sources empty when
# only sonar.tests is set. Tests are re-categorised via sonar.test.inclusions
# so tests/ is not indexed twice.
sonar.sources=.
sonar.test.inclusions=tests/**

# Tests: pytest sources, excluded from the coverage denominator.
sonar.tests=tests

# Coverage: coverage.py XML written by the default pytest run.
sonar.python.coverage.reportPaths=coverage.xml

# Generated/config files. This list replaces the scanner's default exclusions
# entirely, so the standard build-output patterns are kept here too.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,coverage.xml,**/*.db
